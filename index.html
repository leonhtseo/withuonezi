<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>위쥬 WITHU</title><meta name="theme-color" content="#fff6fb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="WITHU"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6fb;--card:#fff;--ink:#3b2a52;--pink:#ff8cc3;--mine:#ffd1e8;--sub:#8a7aa3;--sun:#fff0a6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d1729;--card:#2b2340;--ink:#f6ecff;--mine:#6b3a69;--sub:#b3a5cc;--sun:#5a4d1f;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1d1729;--card:#2b2340;--ink:#f6ecff;--mine:#6b3a69;--sub:#b3a5cc;--sun:#5a4d1f;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg) radial-gradient(circle,#ff8cc344 1.5px,transparent 2px) 0 0/18px 18px;color:var(--ink);font:15px/1.45 'Gowun Dodum',sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:auto}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
header{display:flex;align-items:center;gap:8px;padding:10px 14px 6px}
.logo{font:26px 'Jua',sans-serif;color:var(--pink);-webkit-text-stroke:1px var(--ink);text-shadow:2px 2px 0 var(--ink);letter-spacing:1px}
.dd{margin-left:auto;font-size:12px;background:var(--sun);border:2px solid var(--ink);border-radius:99px;padding:2px 9px}
.ic{background:var(--card);border:2px solid var(--ink);border-radius:50%;width:32px;height:32px}
nav{display:flex;gap:8px;padding:4px 14px 8px}
nav button{flex:1;font:16px 'Jua',sans-serif;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:5px;box-shadow:2px 2px 0 var(--ink)}
nav button.on{background:var(--pink);color:#3b2a52}
.pg{flex:1;min-height:0;display:flex;flex-direction:column}.pg[hidden]{display:none}
#feed,#sl,#bl{flex:1;overflow-y:auto;padding:8px 14px}
.m{display:flex;gap:7px;margin:10px 0;align-items:flex-start}.m.me{justify-content:flex-end}.m.nt{justify-content:center}
.av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--card);border:2px solid var(--ink);display:grid;place-items:center;font-size:18px}
.w{max-width:78%;display:flex;flex-direction:column}.me .w{align-items:flex-end}
.nick{font:13px 'Jua',sans-serif;color:var(--sub);margin:0 0 2px 4px}
.b{background:var(--card);border:2px solid var(--ink);border-radius:6px 18px 18px 18px;padding:7px 12px;box-shadow:2px 2px 0 var(--ink);word-break:break-word;-webkit-touch-callout:none;user-select:none}
.me .b{background:var(--mine);border-radius:18px 6px 18px 18px}.nt .b{background:var(--sun);border-radius:14px}
.q{font-size:12px;color:var(--sub);border-left:3px solid var(--pink);padding-left:6px;margin-bottom:4px}
.med{min-height:110px;min-width:190px;border-radius:12px;border:2px dashed var(--ink);display:grid;place-items:center;font-size:30px;margin-bottom:5px;background:linear-gradient(135deg,#ffc8e6,#c9bcff)}
.med.video{background:linear-gradient(135deg,#b5e3ff,#d4c5ff)}.med.voice{min-height:0;font-size:15px;padding:8px 14px;background:#ffd9ec;color:#3b2a52;border-style:solid;border-radius:99px}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.chip{font-size:12px;background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:0 7px}
.tp{animation:bl 1s infinite alternate}@keyframes bl{to{opacity:.35}}
#rb{display:none;margin:0 14px;font-size:12px;background:var(--sun);border:2px solid var(--ink);border-radius:12px;padding:4px 10px}
#rb.on{display:flex;justify-content:space-between;gap:8px}#rb button{background:none;border:0}
.att{display:flex;gap:6px;padding:6px 14px 0}.att button{background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:2px 11px;font-size:13px}.att button.on{background:var(--pink);color:#3b2a52}
.cmp{display:flex;gap:8px;padding:6px 14px 12px}.cmp input{flex:1;min-width:0;background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:8px 14px}
#send,.go{font:16px 'Jua',sans-serif;background:var(--pink);color:#3b2a52;border:2px solid var(--ink);border-radius:99px;padding:0 16px;box-shadow:2px 2px 0 var(--ink)}#send:disabled{opacity:.5}
.ni{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:8px 12px;margin-bottom:8px;box-shadow:2px 2px 0 var(--ink)}.ni span{flex:1}.ni button{background:none;border:0}
.hint{font-size:12px;color:var(--sub);text-align:center;margin:6px 0}.fm{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 14px 12px}.fm input,.fm select{min-width:0;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:7px 10px}.fm .w2{grid-column:1/-1}.fm .go{padding:8px}.pic{max-width:220px;max-height:260px;border-radius:12px;display:block;margin-bottom:5px;border:2px solid var(--ink)}.lt{display:block}.lt summary{cursor:pointer;font-weight:bold}.lb{margin:8px 0;white-space:pre-wrap;font-size:14px}.lb.me{color:var(--sub)}.lt .cmp{padding:4px 0 0}#ll{flex:1;overflow-y:auto;padding:8px 14px}
#set{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:16px}#set.on{display:grid}
#set div{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:14px;width:min(520px,100%)}#set textarea{width:100%;height:240px;box-sizing:border-box;background:var(--bg);border:2px solid var(--ink);border-radius:12px;padding:8px}
#set p{margin:0 0 8px;font:18px 'Jua',sans-serif}#set .r{display:flex;gap:8px;margin-top:8px}#set .r button{padding:6px 12px;border:2px solid var(--ink);border-radius:99px;background:var(--bg)}
</style></head><body><div id="app">
<header><span class="logo">WITHU</span><span class="dd" id="dd"></span><button class="ic" id="gear" aria-label="설정">⚙️</button></header>
<nav><button class="on" data-t="chat">💌 톡</button><button data-t="sc">🗓 스케줄</button><button data-t="bt">🍡 떡밥</button><button data-t="lt">✉️ 편지함</button></nav>
<section class="pg" id="chat"><div id="feed"></div><div id="rb"><span id="rt"></span><button id="rx" aria-label="답장 취소">✕</button></div>
<div class="att"><button data-a="photo">📷 사진</button><button data-a="video">🎞 영상</button><button data-a="voice">🎙 보이스</button></div>
<div class="cmp"><input id="in" placeholder="팬들에게 메시지 보내기" autocomplete="off"><button id="send">전송</button></div></section>
<section class="pg" id="sc" hidden><div id="sl"><div id="s1"></div><div id="s2"></div></div><div class="fm"><input id="sd" type="date" aria-label="날짜"><input id="st" type="time" aria-label="시간"><input class="w2" id="sn" placeholder="어떤 스케줄? 예) 네덜란드 암스테르담 콘서트" autocomplete="off"><select id="sw"><option>그룹</option><option>개인</option><option>멤버와 함께</option></select><input id="sm" placeholder="함께하는 멤버(선택)" autocomplete="off"><button class="go w2" id="sa">스케줄 등록</button></div><div class="fm"><select class="w2" id="nk"><option>일반 공지</option><option>불참 공지</option><option>활동 중단 공지</option><option>활동 재개</option></select><input class="w2" id="nc" placeholder="내용·사유·기간 예) 10/22 콘서트 불참 / 2주간 휴식" autocomplete="off"><button class="go w2" id="na">📢 공지 올리기</button></div></section>
<section class="pg" id="bt" hidden><div id="bl"></div><div class="fm"><input id="bh" type="time" aria-label="업로드 시간"><select id="bp"><option>연스타(개인 인스타)</option><option>앚트(공식 트위터)</option><option>앚튜브(공식 유튜브)</option><option>틱톡</option><option>릴스</option><option>원츄(팬카페 app)</option><option>기타</option></select><input class="w2" id="bc" placeholder="어떤 떡밥? 예) Let’s go" autocomplete="off"><input class="w2" id="bn" placeholder="부연 설명 예) 비행기 이륙 전 찍은 셀카" autocomplete="off"><button class="go w2" id="ba">떡밥 올리기</button></div></section>
<section class="pg" id="lt" hidden><div id="ll"></div><div class="fm"><button class="go w2" id="lg">✉️ 새 편지 확인하기</button></div></section>
<div id="set"><div><p>AI 연결 설정</p><label style="display:block;font-size:13px">Google Gemini API 키 (이 탭에서만 유지)</label><input id="apikey" type="password" placeholder="AIza..." style="width:100%;box-sizing:border-box;padding:8px;border-radius:10px;border:2px solid var(--ink);background:var(--bg)"><p style="font:12px sans-serif;margin:7px 0">Google AI Studio에서 발급한 키를 입력하세요. 키는 파일이나 로컬 저장소에 저장하지 않습니다. 공유 PC에서는 사용을 피하세요.</p><p>프로필·팬덤 설정</p><textarea id="pf"></textarea><div class="r"><button id="ps">저장</button><button id="pc">대화 기록 지우기</button><button id="px">닫기</button></div></div></div></div>
<script>
let API_KEY='';
const $=s=>document.querySelector(s),H=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e},sleep=ms=>new Promise(r=>setTimeout(r,ms));
const FANS=[['여누바라기','🐰','고3. 서바이벌 때부터 팬. 다정하고 눈물 많음, ㅠㅠ 자주 씀, 반존대'],['nunu_LA','🌴','미국 사는 교포 20대. 영어 섞어 씀(omg, literally)'],['탕후루','🍡','중2. 줄임말·오타 많음, ㅋㅋㅋ, 텐션 높음'],['퇴근하고덕질','☕','30대 직장인. 존댓말, 지친 하루에 위로받음'],['시즌1고인물','🕰️','서바이벌부터 팬. 옛날 무대·밈 소환, 감성적'],['Mika','🌸','일본 팬. 한국어 약간 어색, 일본어 단어 한두 개'],['흰냥집사','🐈','20대. 연우를 흰 고양이에 비유, 냥 드립'],['케미러','🧷','멤버 조합 덕후. 다른 멤버(소율·하나·채이·유리)와의 케미 언급'],['말없는대학생','🎧','20대 남. 짧고 담백, 가끔 훅 들어오는 진심'],['깐깐한까빠','🧐','아주 약한 통제형. 다음엔 ~해줘요 식 소소한 요구, 말투는 귀엽게 새침'],['입덕3일차','🐣','갓 입덕. 호들갑, 용어 질문, 이모지 폭발'],['Pim_BKK','🥭','태국 팬. 영어+한국어 섞음, 이모지 많음'],['작사노트','✍️','음악 팬. 작사작곡·보컬 칭찬, 진지하고 길게'],['담담한팬','🧢','30대 남. 담백하고 짧게 응원, 가끔 근황 한마디']];
const DEF='가상 그룹 아리즈(서바이벌 프로젝트 13인 → 2년 활동 후 5인 정규 계약, 데뷔 5년 차, 컴백마다 화제+차트 1위). 콘셉트는 세련·몽환과 대중적인 느낌을 번갈아 활동.\n멤버: 소율(95, 리더, 리드보컬, ENFP, 개그코드 자부심, 연우와 주장-부주장 신뢰), 하나(99, 메인댄서, 엉뚱·센스, 연우와 같은 소속사 출신 재회 케미), 채이(00, 리드보컬·메인댄서, ISTP 새침·솔직·귀여움, 연우와 서로 최애), 서연우(02, 메인보컬·리드댄서·작사작곡·연기, INTJ/INFJ, 캐나다 거주 경험으로 영어 능통, 한국·영어권 연기 활동, 흰 고양이 이미지, 청순하고 다정하지만 알수록 특이하고 매력적), 유리(03, 막내, 리드보컬, 댕댕이, 연우와 막내라인 케미).\n연우 애칭: 여누, 누누, 레온. 연우는 부드럽고 다정한 반말로 메시지를 보냄.\n팬덤명 위리즈(여 90 남 10, 10~30대, 해외 팬 다수, 서바이벌 때부터 팬+계속 유입). 규모는 1군 남돌급. 데뷔일 10/29, 생일 10/31.';
let S={msgs:[],notes:[],last:0,evd:'',profile:DEF};try{Object.assign(S,JSON.parse(localStorage.getItem('withu')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('withu',JSON.stringify({...S,msgs:S.msgs.slice(-60).map((m,i,a)=>i<a.length-20&&m.img?{...m,img:undefined}:m),lt:(S.lt||[]).slice(0,30)}))}catch(e){}};
const feed=$('#feed'),X=new Map(),U=new Map(),down=()=>feed.scrollTop=feed.scrollHeight;let R=null,att=null,pend=null,busy=0;
const AV=['🐰','🍡','🐈','🌸','🍓','🧸','🌙','🐥','🍀','🎧','☕','🦊','🍑','🐻','🌷','🐬'],fan=n=>['',AV[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%AV.length]];
const dday=(m,d)=>{const z=new Date();z.setHours(0,0,0,0);const t=new Date(z.getFullYear(),m-1,d);if(t<z)t.setFullYear(z.getFullYear()+1);return Math.round((t-z)/864e5)};
const dl=n=>n?'D-'+n:'D-DAY';
function paint(m){const r=X.get(m);if(r)r.replaceChildren(...Object.entries(m.rx||{}).map(([e,n])=>H('span','chip',e+' '+n)))}
function hold(b,m){let t;const go=()=>{R={nick:m.nick,t:m.t.slice(0,40)};$('#rt').textContent='↩ '+R.nick+': '+R.t;$('#rb').classList.add('on');$('#in').focus()};
b.onpointerdown=()=>t=setTimeout(go,450);['pointerup','pointerleave','pointermove'].forEach(k=>b['on'+k]=()=>clearTimeout(t));b.oncontextmenu=e=>{e.preventDefault();go()};b.ondblclick=go}
function draw(m){const r=H('div','m '+(m.k=='me'?'me':m.k=='note'?'nt':''));if(m.k=='fan')r.append(H('div','av',fan(m.nick)[1]));
const w=H('div','w');if(m.k=='fan')w.append(H('div','nick',m.nick));if(m.k=='note')w.append(H('div','nick',m.lab||'🍡 떡밥'));
const b=H('div','b');if(m.q)b.append(H('div','q','↩ '+m.q.nick+': '+m.q.t));
if(m.type&&m.type!='text'){const u=U.get(m);let c;if(m.type=='voice'){c=H('div','med voice','▶ ▂▅▇▅▃▂▄▆▃▂ 0:'+String(m.d).padStart(2,'0'));if(u)c.onclick=()=>new Audio(u).play()}else if(m.type=='video'&&u){c=H('video','pic');c.src=u;c.controls=true;c.poster=m.img||''}else if(m.img){c=H('img','pic');c.src=m.img;c.alt=''}else c=H('div','med '+m.type,m.type=='video'?'▶':'📷');b.append(c)}
if(m.t)b.append(H('div','',m.t));if(m.k=='me'&&m.t&&m.t.includes('##'))b.append(H('div','q','## → 팬마다 각자 닉네임으로 보여요'));w.append(b);if(m.k=='fan')hold(b,m);const rx=H('div','rx');w.append(rx);X.set(m,rx);r.append(w);feed.append(r);paint(m);down()}
function add(m){S.msgs.push(m);draw(m);save()}
S.msgs.forEach(draw);

async function pack(s,w,h){const cv=z=>{const r=Math.min(1,z/Math.max(w,h)),c=H('canvas');c.width=Math.round(w*r);c.height=Math.round(h*r);c.getContext('2d').drawImage(s,0,0,c.width,c.height);return c};return{img:cv(320).toDataURL('image/jpeg',.7),blob:await new Promise(r=>cv(640).toBlob(r,'image/jpeg',.8))}}
function pick(a,b){ff.accept={photo:'image/*',video:'video/*',voice:'audio/*'}[a];ff.value='';ff.onchange=()=>{const f=ff.files[0];if(!f)return;const u=URL.createObjectURL(f);if(a=='photo'){const im=new Image();im.onload=async()=>{pend=await pack(im,im.naturalWidth,im.naturalHeight);act(a,b)};im.src=u;return}const v=H(a=='video'?'video':'audio');v.muted=true;v.preload='auto';v.onloadedmetadata=()=>{const d=Math.round(v.duration)||0;if(a=='voice'){pend={u,d};act(a,b);return}v.currentTime=Math.min(1,v.duration/2);v.onseeked=async()=>{v.onseeked=null;pend={...await pack(v,v.videoWidth,v.videoHeight),u,d};act(a,b)}};v.src=u};ff.click()}

async function ai(prompt,img){
 if(!API_KEY){$('#gear').click();throw Error('API 키를 설정해 주세요')}
 const parts=[{text:prompt}];
 if(img){const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(img)});parts.push({inline_data:{mime_type:img.type||'image/jpeg',data}})}

 const out=await res.json();if(!res.ok)throw Error(out.error?.message||'AI 요청 실패');
 const raw=out.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';
 try{return JSON.parse(raw)}catch(e){return JSON.parse(raw.match(/\{[\s\S]*\}/)?.[0]||'{}')}
}
